const spots=[];for(let i=1;i<=20;i++)spots.push({n:i,f:i<=11?'B1':'B2',accessible:i===1||i===12,status:'available'});let selected=[3];const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');function renderSpots(){['B1','B2'].forEach(f=>{$(f.toLowerCase()).innerHTML='';spots.filter(s=>s.f===f).forEach(s=>{let d=document.createElement('div');d.className='spot '+(selected.includes(s.n)?'sel ':'')+(s.status==='occupied'?'occ ':s.status==='reserved'?'res ':s.status==='maintenance'?'maint ':'');d.innerHTML=`<b>${pad(s.n)}${s.accessible?' ♿':''}</b><small>${s.status==='available'?'متاح':s.status==='occupied'?'مشغول':s.status==='reserved'?'محجوز':s.status==='maintenance'?'صيانة':'مشكلة'}</small>`;d.onclick=()=>pick(s.n);$(f.toLowerCase()).appendChild(d)})})}function pick(n){if($('multi').checked){selected.includes(n)?selected=selected.filter(x=>x!==n):selected.push(n)}else selected=[n];renderSpots();renderPlateInputs()}$('multi').onchange=()=>{if(!$('multi').checked&&selected.length>1)selected=[selected[0]];renderSpots();renderPlateInputs()};function renderPlateInputs(){let box=$('multiPlates'),list=$('platesList');if(!$('multi').checked){box.style.display='none';return}box.style.display='block';list.innerHTML='';selected.forEach((n,i)=>{let x=document.createElement('input');x.id='mplate'+n;x.placeholder=`لوحة موقف ${pad(n)}`;x.value=i===0?$('plate').value:'';list.appendChild(x)})}function fmt(v){if(!v)return '-';let d=new Date(v);return `${pad(d.getHours())}:${pad(d.getMinutes())} · ${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`}function permitCode(){return 'PK-'+($('room').value||'ROOM')+'-'+selected.map(pad).join('')}function plates(){if($('multi').checked){let o={};selected.forEach(n=>o[n]=($('mplate'+n)?.value||''));return o}return{[selected[0]]:$('plate').value}}function dataNow(){return{room:$('room').value,spots:[...selected],plates:plates(),start:$('start').value,end:$('end').value,code:permitCode(),floors:Object.fromEntries(selected.map(n=>[n,spots.find(s=>s.n===n).f]))}}function permitHTML(data){let cards=data.spots.map(n=>`<div class="permit-spot"><div class="spot-top"><div><div class="floorname">${spots.find(s=>s.n===n)?.f||data.floors?.[n]||''} · موقف</div><div class="num">${pad(n)}</div></div><div style="color:#708197">رقم الموقف</div></div><div class="plate">لوحة السيارة: ${data.plates[n]||'-'}</div></div>`).join('');return `<div class="permit"><div class="permit-head"><img class="logo" src="${LOGO_DATA}" alt="شعار ديار المدينة"><div class="copy"><h1>تصريح موقف</h1><div>PARKING PERMIT</div></div><div class="pbox">P</div></div>${cards}<div style="margin-top:16px"><div class="prow"><span>رقم الغرفة</span><b>${data.room||'-'}</b></div><div class="prow"><span>رقم التصريح</span><b>${data.code}</b></div><div class="prow"><span>صالح من</span><b>${fmt(data.start)}</b></div><div class="prow"><span>صالح حتى</span><b>${fmt(data.end)}</b></div></div><div class="msg">يرجى إبراز التصريح للحارس عند الدخول</div><div class="print" onclick="window.print()">🖨️ طباعة التصريح / حفظ PDF</div></div>`}function previewPermit(){if(!selected.length)return alert('اختر موقفاً');$('permitHost').innerHTML=permitHTML(dataNow())}function saveBooking(){if(!selected.length)return alert('اختر موقفاً');selected.forEach(n=>spots.find(s=>s.n===n).status=$('status').value);renderSpots();previewPermit()}function clearForm(){$('room').value='';$('plate').value='';$('notes').value='';selected=[];renderSpots();$('permitHost').innerHTML='';renderPlateInputs()}function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_')}function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}function validDates(){let s=new Date($('start').value),e=new Date($('end').value);if(!Number.isFinite(s.getTime())||!Number.isFinite(e.getTime())||e<=s||e<=new Date()){alert('تأكد أن تاريخ النهاية بعد البداية وفي المستقبل.');return false}return true}function createGuestLink(){if(!validDates())return;let d=dataNow(),url=location.origin+location.pathname+'?permit='+enc(d);$('linkMsg').textContent=url;navigator.clipboard?.writeText(url);return url}async function sharePermit(){let url=createGuestLink();if(!url)return;if(navigator.share)try{await navigator.share({title:'تصريح موقف',text:'تصريح موقف الفندق',url})}catch(e){}}function initDates(){let now=new Date(),end=new Date(now.getTime()+3*86400000),local=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$('start').value=local(now);$('end').value=local(end)}function guestMode(){let p=new URLSearchParams(location.search).get('permit');if(!p)return false;try{let d=dec(p),e=new Date(d.end);$('staffView').style.display='none';$('guestView').style.display='block';$('guestView').innerHTML=e<=new Date()?'<div class="title">انتهت صلاحية التصريح</div>':permitHTML(d);return true}catch(e){return false}}initDates();renderSpots();renderPlateInputs();if(!guestMode())previewPermit();
</script></body></html>
