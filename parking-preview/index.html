<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#122844">

  <title>نظام مواقف ديار المدينة</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(#07101d, #0d1b2d);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      color: #fff;
    }

    .wrap {
      max-width: 760px;
      margin: auto;
      padding: 16px;
    }

    .panel {
      background: #10213a;
      border: 1px solid #405978;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .title {
      font-size: 26px;
      font-weight: 900;
    }

    .sub {
      color: #b8c4d6;
      margin-top: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .spot {
      border: 1px solid #476281;
      border-radius: 14px;
      background: #152844;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.15s;
    }

    .spot:hover {
      transform: translateY(-1px);
    }

    .spot b {
      font-size: 22px;
      display: block;
    }

    .spot small {
      color: #b8c4d6;
    }

    .spot.sel {
      outline: 2px solid #8ebcff;
    }

    .spot.occ {
      background: #3e2430;
    }

    .spot.res {
      background: #4b3f19;
    }

    .spot.maint {
      background: #303744;
    }

    .spot.problem {
      background: #552b2b;
    }

    .floor {
      font-weight: 800;
      margin: 12px 0 8px;
    }

    .form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field label {
      display: block;
      color: #b8c4d6;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      background: #152844;
      color: #fff;
      border: 1px solid #476281;
      border-radius: 10px;
      padding: 10px;
      font: inherit;
    }

    .field textarea {
      min-height: 70px;
      resize: vertical;
    }

    .wide {
      grid-column: 1 / -1;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 11px 14px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
    }

    .primary {
      background: #2b74ce;
      color: #fff;
    }

    .secondary {
      background: #273c58;
      color: #fff;
    }

    .danger {
      background: #66323a;
      color: #fff;
    }

    .mini {
      font-size: 12px;
      color: #71849d;
      margin-top: 8px;
      word-break: break-all;
    }

    .plates-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .plates-list input {
      width: 100%;
      background: #152844;
      color: #fff;
      border: 1px solid #476281;
      border-radius: 10px;
      padding: 10px;
    }

    /* ===========================
       تصريح الموقف
    =========================== */

    .permit {
      background: #fff;
      color: #122844;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 16px 40px #0004;
      margin-top: 12px;
    }

    .permit-head {
      background: #122844;
      border-radius: 15px;
      padding: 14px 16px;

      display: grid;
      grid-template-columns: 125px 1fr 66px;
      align-items: center;
      gap: 12px;

      direction: ltr;
      min-height: 150px;
    }

    /* الشعار الشفاف */
    .logo-box {
      width: 120px;
      height: 130px;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: visible;
      background: transparent;
    }

    .logo {
      width: 115px;
      height: 125px;

      display: block;

      object-fit: contain;
      object-position: center;

      background: transparent;
    }

    .copy {
      direction: rtl;
      text-align: center;
      color: #fff;
    }

    .copy h1 {
      font-size: 32px;
      font-weight: 900;
      margin: 0;
    }

    .copy div {
      direction: ltr;
      font-size: 16px;
      margin-top: 5px;
    }

    .pbox {
      width: 62px;
      height: 62px;

      border-radius: 10px;

      background: #2b74ce;

      display: grid;
      place-items: center;

      color: #122844;
      font-size: 38px;
      font-weight: 900;
    }

    .permit-spot {
      margin-top: 16px;
      border: 1px solid #d9e2ee;
      background: #f8fbff;
      border-radius: 14px;
      padding: 16px;
    }

    .spot-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .num {
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
    }

    .floorname {
      font-weight: 800;
      color: #2675cf;
      font-size: 20px;
    }

    .plate {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #dbe3ed;
      font-weight: 700;
    }

    .prow {
      display: flex;
      justify-content: space-between;
      gap: 16px;

      border-bottom: 1px solid #dbe3ed;
      padding: 13px 0;
    }

    .msg {
      text-align: center;
      font-weight: 800;
      margin-top: 20px;
      font-size: 18px;
    }

    .print {
      margin-top: 18px;
      border-radius: 12px;
      padding: 14px;

      background: #2b74ce;
      color: #fff;

      text-align: center;
      font-weight: 800;
      cursor: pointer;
    }

    /* ===========================
       الجوال
    =========================== */

    @media (max-width: 560px) {

      .grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .form {
        grid-template-columns: 1fr;
      }

      .wide {
        grid-column: auto;
      }

      .permit {
        padding: 14px;
      }

      .permit-head {
        grid-template-columns: 92px 1fr 54px;
        min-height: 122px;
        padding: 10px;
        gap: 8px;
      }

      .logo-box {
        width: 90px;
        height: 104px;
      }

      .logo {
        width: 88px;
        height: 102px;
      }

      .copy h1 {
        font-size: 27px;
      }

      .copy div {
        font-size: 14px;
      }

      .pbox {
        width: 52px;
        height: 52px;
        font-size: 32px;
      }

      .num {
        font-size: 62px;
      }

      .plates-list {
        grid-template-columns: 1fr;
      }
    }

    /* ===========================
       الطباعة
    =========================== */

    @media print {

      body {
        background: #fff;
      }

      .panel:not(.permitWrap) {
        display: none !important;
      }

      .wrap {
        max-width: none;
        padding: 0;
      }

      .permit {
        box-shadow: none;
        margin: 0;
      }

      .print {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <!-- صفحة النزيل -->
  <div
    class="panel permitWrap"
    id="guestView"
    style="display:none"
  ></div>

  <!-- صفحة الموظف -->
  <div id="staffView">

    <div class="panel">

      <div class="title">
        نظام إدارة مواقف الفندق
      </div>

      <div class="sub">
        20 موقف — B1 و B2 — المواقف 01 و12 مخصصة ♿
      </div>

    </div>

    <div class="panel">

      <label class="toggle">

        <input type="checkbox" id="multi">

        حجز عدة مواقف لنفس النزيل

      </label>

      <div class="floor">
        B1 — 11 مواقف
      </div>

      <div
        class="grid"
        id="b1"
      ></div>

      <div class="floor">
        B2 — 9 مواقف
      </div>

      <div
        class="grid"
        id="b2"
      ></div>

    </div>

    <div class="panel">

      <div class="form">

        <div class="field">

          <label>
            رقم الغرفة
          </label>

          <input
            id="room"
            value="204"
          >

        </div>

        <div class="field">

          <label>
            لوحة السيارة
          </label>

          <input
            id="plate"
            value="أ ب ج 1234"
          >

        </div>

        <div class="field">

          <label>
            صالح من
          </label>

          <input
            id="start"
            type="datetime-local"
          >

        </div>

        <div class="field">

          <label>
            صالح حتى
          </label>

          <input
            id="end"
            type="datetime-local"
          >

        </div>

        <div class="field">

          <label>
            المبلغ
          </label>

          <input
            id="amount"
            type="number"
            value="50"
          >

        </div>

        <div class="field">

          <label>
            المدفوع
          </label>

          <input
            id="paid"
            type="number"
            value="50"
          >

        </div>

        <div class="field">

          <label>
            الحالة
          </label>

          <select id="status">

            <option value="occupied">
              مشغول
            </option>

            <option value="reserved">
              محجوز
            </option>

            <option value="maintenance">
              صيانة
            </option>

            <option value="problem">
              مشكلة
            </option>

          </select>

        </div>

        <div class="field wide">

          <label>
            ملاحظات الاستقبال
          </label>

          <textarea
            id="notes"
            placeholder="هذه لا تظهر للحارس أو النزيل"
          ></textarea>

        </div>

      </div>

      <div
        id="multiPlates"
        style="display:none"
      >

        <div class="floor">
          لوحات السيارات للمواقف المختارة
        </div>

        <div
          class="plates-list"
          id="platesList"
        ></div>

      </div>

      <div
        class="actions"
        style="margin-top:12px"
      >

        <button
          class="btn primary"
          onclick="previewPermit()"
        >
          معاينة التصريح
        </button>

        <button
          class="btn secondary"
          onclick="saveBooking()"
        >
          حفظ
        </button>

        <button
          class="btn secondary"
          onclick="createGuestLink()"
        >
          إنشاء رابط مؤقت
        </button>

        <button
          class="btn secondary"
          onclick="sharePermit()"
        >
          مشاركة
        </button>

        <button
          class="btn danger"
          onclick="clearForm()"
        >
          مسح
        </button>

      </div>

      <div
        class="mini"
        id="linkMsg"
      ></div>

    </div>

    <div
      class="panel"
      id="permitHost"
    ></div>

  </div>
</div>


<script>

/* =====================================================
   الشعار الشفاف
===================================================== */

const LOGO_DATA =
  './diyar-logo-transparent.png';


/* =====================================================
   بيانات المواقف
===================================================== */

const spots = [];

for (let i = 1; i <= 20; i++) {

  spots.push({

    n: i,

    f:
      i <= 11
        ? 'B1'
        : 'B2',

    accessible:
      i === 1 ||
      i === 12,

    status:
      'available'

  });

}


let selected = [3];


const $ =
  id =>
    document.getElementById(id);


const pad =
  n =>
    String(n)
      .padStart(2, '0');


/* =====================================================
   عرض المواقف
===================================================== */

function renderSpots() {

  ['B1', 'B2']
    .forEach(floor => {

      const box =
        $(floor.toLowerCase());

      box.innerHTML = '';

      spots
        .filter(
          spot =>
            spot.f === floor
        )
        .forEach(spot => {

          const div =
            document.createElement('div');


          let extraClass = '';

          if (spot.status === 'occupied') {
            extraClass = 'occ';
          }

          else if (spot.status === 'reserved') {
            extraClass = 'res';
          }

          else if (spot.status === 'maintenance') {
            extraClass = 'maint';
          }

          else if (spot.status === 'problem') {
            extraClass = 'problem';
          }


          div.className =
            'spot ' +
            (
              selected.includes(spot.n)
                ? 'sel '
                : ''
            ) +
            extraClass;


          let statusText =
            'متاح';


          if (spot.status === 'occupied') {
            statusText = 'مشغول';
          }

          else if (spot.status === 'reserved') {
            statusText = 'محجوز';
          }

          else if (spot.status === 'maintenance') {
            statusText = 'صيانة';
          }

          else if (spot.status === 'problem') {
            statusText = 'مشكلة';
          }


          div.innerHTML = `

            <b>

              ${pad(spot.n)}

              ${
                spot.accessible
                  ? ' ♿'
                  : ''
              }

            </b>

            <small>
              ${statusText}
            </small>

          `;


          div.onclick =
            () =>
              pick(spot.n);


          box.appendChild(div);

        });

    });

}


/* =====================================================
   اختيار موقف
===================================================== */

function pick(number) {

  if ($('multi').checked) {

    if (
      selected.includes(number)
    ) {

      selected =
        selected.filter(
          value =>
            value !== number
        );

    }

    else {

      selected.push(number);

    }

  }

  else {

    selected = [number];

  }


  renderSpots();

  renderPlateInputs();

}


/* =====================================================
   الحجز المتعدد
===================================================== */

$('multi').onchange =
  () => {

    if (
      !$('multi').checked &&
      selected.length > 1
    ) {

      selected =
        [selected[0]];

    }


    renderSpots();

    renderPlateInputs();

  };


function renderPlateInputs() {

  const box =
    $('multiPlates');

  const list =
    $('platesList');


  if (
    !$('multi').checked
  ) {

    box.style.display =
      'none';

    return;

  }


  box.style.display =
    'block';


  list.innerHTML =
    '';


  selected
    .forEach(
      (number, index) => {

        const input =
          document.createElement(
            'input'
          );


        input.id =
          'mplate' + number;


        input.placeholder =
          `لوحة موقف ${pad(number)}`;


        if (index === 0) {

          input.value =
            $('plate').value;

        }


        list.appendChild(
          input
        );

      }
    );

}


/* =====================================================
   التاريخ
===================================================== */

function fmt(value) {

  if (!value) {
    return '-';
  }


  const date =
    new Date(value);


  return (
    `${pad(date.getHours())}:` +
    `${pad(date.getMinutes())}` +
    ` · ` +
    `${date.getFullYear()}/` +
    `${pad(date.getMonth() + 1)}/` +
    `${pad(date.getDate())}`
  );

}


/* =====================================================
   رقم التصريح
===================================================== */

function permitCode() {

  return (
    'PK-' +
    (
      $('room').value ||
      'ROOM'
    ) +
    '-' +
    selected
      .map(pad)
      .join('')
  );

}


/* =====================================================
   اللوحات
===================================================== */

function plates() {

  if (
    $('multi').checked
  ) {

    const result = {};


    selected.forEach(
      number => {

        result[number] =
          $('mplate' + number)
            ?.value ||
          '';

      }
    );


    return result;

  }


  return {

    [selected[0]]:
      $('plate').value

  };

}


/* =====================================================
   جمع بيانات التصريح
===================================================== */

function dataNow() {

  return {

    room:
      $('room').value,

    spots:
      [...selected],

    plates:
      plates(),

    start:
      $('start').value,

    end:
      $('end').value,

    code:
      permitCode(),

    floors:
      Object.fromEntries(

        selected.map(
          number => [

            number,

            spots.find(
              spot =>
                spot.n === number
            )?.f || ''

          ]
        )

      )

  };

}


/* =====================================================
   إنشاء شكل التصريح
===================================================== */

function permitHTML(data) {

  const cards =
    data.spots
      .map(number => {

        const floor =
          spots.find(
            spot =>
              spot.n === number
          )?.f ||

          data.floors?.[number] ||

          '';


        return `

          <div class="permit-spot">

            <div class="spot-top">

              <div>

                <div class="floorname">

                  ${floor} · موقف

                </div>

                <div class="num">

                  ${pad(number)}

                </div>

              </div>


              <div
                style="color:#708197"
              >

                رقم الموقف

              </div>

            </div>


            <div class="plate">

              لوحة السيارة:

              ${
                data.plates[number] ||
                '-'
              }

            </div>

          </div>

        `;

      })
      .join('');


  return `

    <div class="permit">

      <div class="permit-head">


        <div class="logo-box">

          <img
            class="logo"
            src="${LOGO_DATA}"
            alt="شعار ديار المدينة"
          >

        </div>


        <div class="copy">

          <h1>
            تصريح موقف
          </h1>

          <div>
            PARKING PERMIT
          </div>

        </div>


        <div class="pbox">
          P
        </div>


      </div>


      ${cards}


      <div
        style="margin-top:16px"
      >


        <div class="prow">

          <span>
            رقم الغرفة
          </span>

          <b>
            ${
              data.room ||
              '-'
            }
          </b>

        </div>


        <div class="prow">

          <span>
            رقم التصريح
          </span>

          <b>
            ${data.code}
          </b>

        </div>


        <div class="prow">

          <span>
            صالح من
          </span>

          <b>
            ${fmt(data.start)}
          </b>

        </div>


        <div class="prow">

          <span>
            صالح حتى
          </span>

          <b>
            ${fmt(data.end)}
          </b>

        </div>


      </div>


      <div class="msg">

        يرجى إبراز التصريح للحارس عند الدخول

      </div>


      <div
        class="print"
        onclick="window.print()"
      >

        🖨️ طباعة التصريح / حفظ PDF

      </div>


    </div>

  `;

}


/* =====================================================
   معاينة التصريح
===================================================== */

function previewPermit() {

  if (
    !selected.length
  ) {

    alert(
      'اختر موقفاً'
    );

    return;

  }


  $('permitHost')
    .innerHTML =
      permitHTML(
        dataNow()
      );

}


/* =====================================================
   حفظ حالة الموقف
===================================================== */

function saveBooking() {

  if (
    !selected.length
  ) {

    alert(
      'اختر موقفاً'
    );

    return;

  }


  selected
    .forEach(number => {

      const spot =
        spots.find(
          value =>
            value.n === number
        );


      if (spot) {

        spot.status =
          $('status').value;

      }

    });


  renderSpots();

  previewPermit();

}


/* =====================================================
   مسح
===================================================== */

function clearForm() {

  $('room').value =
    '';

  $('plate').value =
    '';

  $('notes').value =
    '';

  $('amount').value =
    '';

  $('paid').value =
    '';


  selected =
    [];


  renderSpots();


  $('permitHost')
    .innerHTML =
      '';


  renderPlateInputs();

}


/* =====================================================
   ترميز الرابط المؤقت
===================================================== */

function encodePermit(object) {

  return btoa(

    unescape(

      encodeURIComponent(

        JSON.stringify(
          object
        )

      )

    )

  )

  .replace(
    /=/g,
    ''
  )

  .replace(
    /\+/g,
    '-'
  )

  .replace(
    /\//g,
    '_'
  );

}


/* =====================================================
   فك الرابط
===================================================== */

function decodePermit(value) {

  let text =
    value

      .replace(
        /-/g,
        '+'
      )

      .replace(
        /_/g,
        '/'
      );


  while (
    text.length % 4
  ) {

    text += '=';

  }


  return JSON.parse(

    decodeURIComponent(

      escape(

        atob(text)

      )

    )

  );

}


/* =====================================================
   التحقق من التواريخ
===================================================== */

function validDates() {

  const start =
    new Date(
      $('start').value
    );


  const end =
    new Date(
      $('end').value
    );


  if (
    !Number.isFinite(
      start.getTime()
    ) ||

    !Number.isFinite(
      end.getTime()
    )
  ) {

    alert(
      'حدد تاريخ البداية والنهاية.'
    );

    return false;

  }


  if (
    end <= start
  ) {

    alert(
      'تاريخ المغادرة يجب أن يكون بعد تاريخ البداية.'
    );

    return false;

  }


  if (
    end <= new Date()
  ) {

    alert(
      'تاريخ انتهاء التصريح يجب أن يكون في المستقبل.'
    );

    return false;

  }


  return true;

}


/* =====================================================
   إنشاء رابط النزيل
===================================================== */

function createGuestLink() {

  if (
    !validDates()
  ) {

    return;

  }


  const data =
    dataNow();


  const url =
    location.origin +
    location.pathname +
    '?permit=' +
    encodePermit(data);


  $('linkMsg')
    .textContent =
      url;


  if (
    navigator.clipboard
  ) {

    navigator.clipboard
      .writeText(url)
      .catch(() => {});

  }


  return url;

}


/* =====================================================
   المشاركة
===================================================== */

async function sharePermit() {

  const url =
    createGuestLink();


  if (!url) {
    return;
  }


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          'تصريح موقف',

        text:
          'تصريح موقف الفندق',

        url:
          url

      });

    }

    catch (error) {

    }

  }

  else {

    alert(
      'تم نسخ رابط التصريح.'
    );

  }

}


/* =====================================================
   الوقت الافتراضي
===================================================== */

function initDates() {

  const now =
    new Date();


  const end =
    new Date(

      now.getTime() +

      (
        3 *
        24 *
        60 *
        60 *
        1000
      )

    );


  const local =
    date =>

      new Date(

        date.getTime() -

        date.getTimezoneOffset() *
        60000

      )

      .toISOString()

      .slice(
        0,
        16
      );


  $('start').value =
    local(now);


  $('end').value =
    local(end);

}


/* =====================================================
   رابط النزيل
===================================================== */

function guestMode() {

  const token =

    new URLSearchParams(
      location.search
    )

    .get(
      'permit'
    );


  if (!token) {

    return false;

  }


  try {

    const data =
      decodePermit(
        token
      );


    const end =
      new Date(
        data.end
      );


    $('staffView')
      .style.display =
        'none';


    $('guestView')
      .style.display =
        'block';


    if (
      end <= new Date()
    ) {

      $('guestView')
        .innerHTML = `

          <div class="title">

            انتهت صلاحية التصريح

          </div>

        `;

    }

    else {

      $('guestView')
        .innerHTML =
          permitHTML(
            data
          );

    }


    return true;

  }

  catch (error) {

    $('staffView')
      .style.display =
        'none';


    $('guestView')
      .style.display =
        'block';


    $('guestView')
      .innerHTML = `

        <div class="title">

          رابط التصريح غير صالح

        </div>

      `;


    return true;

  }

}


/* =====================================================
   تشغيل النظام
===================================================== */

initDates();

renderSpots();

renderPlateInputs();

if (
  !guestMode()
) {

  previewPermit();

}

</script>
