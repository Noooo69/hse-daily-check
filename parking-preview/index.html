<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122844"><title>نظام مواقف ديار المدينة</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07101d,#0d1b2d);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:#fff}.wrap{max-width:760px;margin:auto;padding:16px}.panel{background:#10213a;border:1px solid #405978;border-radius:20px;padding:16px;margin-bottom:14px}.title{font-size:26px;font-weight:900}.sub{color:#b8c4d6;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.spot{border:1px solid #476281;border-radius:14px;background:#152844;padding:12px;text-align:center;cursor:pointer}.spot b{font-size:22px;display:block}.spot small{color:#b8c4d6}.spot.sel{outline:2px solid #8ebcff}.spot.occ{background:#3e2430}.spot.res{background:#4b3f19}.spot.maint{background:#303744}.floor{font-weight:800;margin:12px 0 8px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:#b8c4d6;font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#152844;color:#fff;border:1px solid #476281;border-radius:10px;padding:10px}.field textarea{min-height:70px}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800}.primary,.print{background:#2b74ce;color:#fff}.secondary{background:#273c58;color:#fff}.danger{background:#66323a;color:#fff}.toggle{display:flex;gap:8px;align-items:center;margin-bottom:10px}.permit{background:#fff;color:#122844;border-radius:24px;padding:22px;box-shadow:0 16px 40px #0004;margin-top:12px}.permit-head{background:#122844;border-radius:15px;padding:14px 16px;display:grid;grid-template-columns:112px 1fr 66px;align-items:center;gap:12px;direction:ltr;min-height:146px}.logo{width:106px;height:126px;object-fit:contain}.copy{direction:rtl;text-align:center;color:#fff}.copy h1{font-size:32px;margin:0}.copy div{direction:ltr;font-size:16px;margin-top:4px}.pbox{width:62px;height:62px;border-radius:10px;background:#2b74ce;display:grid;place-items:center;font-size:38px;font-weight:800}.permit-spot{margin-top:16px;border:1px solid #d9e2ee;background:#f8fbff;border-radius:14px;padding:16px}.spot-top{display:flex;justify-content:space-between}.num{font-size:72px;font-weight:900;line-height:1}.floorname{font-weight:800;color:#2675cf;font-size:20px}.plate{margin-top:12px;padding-top:12px;border-top:1px solid #dbe3ed;font-weight:700}.prow{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #dbe3ed;padding:13px 0}.msg{text-align:center;font-weight:800;margin-top:20px;font-size:18px}.print{margin-top:18px;border-radius:12px;padding:14px;text-align:center;font-weight:800}.mini{font-size:12px;color:#71849d}.plates-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.plates-list input{width:100%;background:#152844;color:#fff;border:1px solid #476281;border-radius:10px;padding:10px}@media(max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}.form{grid-template-columns:1fr}.wide{grid-column:auto}.permit{padding:14px}.permit-head{grid-template-columns:88px 1fr 54px;min-height:120px;padding:10px}.logo{width:84px;height:102px}.copy h1{font-size:27px}.pbox{width:52px;height:52px;font-size:32px}.num{font-size:62px}.plates-list{grid-template-columns:1fr}}@media print{body{background:white}.panel:not(.permitWrap){display:none}.wrap{padding:0}.permit{box-shadow:none;margin:0}}
</style></head><body><div class="wrap"><div class="panel permitWrap" id="guestView" style="display:none"></div><div id="staffView"><div class="panel"><div class="title">نظام إدارة مواقف الفندق</div><div class="sub">20 موقف — B1 و B2 — المواقف 01 و12 مخصصة ♿</div></div><div class="panel"><label class="toggle"><input type="checkbox" id="multi"> حجز عدة مواقف لنفس النزيل</label><div class="floor">B1 — 11 مواقف</div><div class="grid" id="b1"></div><div class="floor">B2 — 9 مواقف</div><div class="grid" id="b2"></div></div><div class="panel"><div class="form"><div class="field"><label>رقم الغرفة</label><input id="room" value="204"></div><div class="field"><label>لوحة السيارة</label><input id="plate" value="أ ب ج 1234"></div><div class="field"><label>صالح من</label><input id="start" type="datetime-local"></div><div class="field"><label>صالح حتى</label><input id="end" type="datetime-local"></div><div class="field"><label>المبلغ</label><input id="amount" type="number" value="50"></div><div class="field"><label>المدفوع</label><input id="paid" type="number" value="50"></div><div class="field"><label>الحالة</label><select id="status"><option value="occupied">مشغول</option><option value="reserved">محجوز</option><option value="maintenance">صيانة</option><option value="problem">مشكلة</option></select></div><div class="field wide"><label>ملاحظات الاستقبال</label><textarea id="notes" placeholder="هذه لا تظهر للحارس أو النزيل"></textarea></div></div><div id="multiPlates" style="display:none"><div class="floor">لوحات السيارات للمواقف المختارة</div><div class="plates-list" id="platesList"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="previewPermit()">معاينة التصريح</button><button class="btn secondary" onclick="saveBooking()">حفظ</button><button class="btn secondary" onclick="createGuestLink()">إنشاء رابط مؤقت</button><button class="btn secondary" onclick="sharePermit()">مشاركة</button><button class="btn danger" onclick="clearForm()">مسح</button></div><div class="mini" id="linkMsg"></div></div><div class="panel" id="permitHost"></div></div></div><script>
const spots=[];for(let i=1;i<=20;i++)spots.push({n:i,f:i<=11?'B1':'B2',accessible:i===1||i===12,status:'available'});let selected=[3];const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');function renderSpots(){['B1','B2'].forEach(f=>{$(f.toLowerCase()).innerHTML='';spots.filter(s=>s.f===f).forEach(s=>{let d=document.createElement('div');d.className='spot '+(selected.includes(s.n)?'sel ':'')+(s.status==='occupied'?'occ ':s.status==='reserved'?'res ':s.status==='maintenance'?'maint ':'');d.innerHTML=`<b>${pad(s.n)}${s.accessible?' ♿':''}</b><small>${s.status==='available'?'متاح':s.status==='occupied'?'مشغول':s.status==='reserved'?'محجوز':s.status==='maintenance'?'صيانة':'مشكلة'}</small>`;d.onclick=()=>pick(s.n);$(f.toLowerCase()).appendChild(d)})})}function pick(n){if($('multi').checked){selected.includes(n)?selected=selected.filter(x=>x!==n):selected.push(n)}else selected=[n];renderSpots();renderPlateInputs()}$('multi').onchange=()=>{if(!$('multi').checked&&selected.length>1)selected=[selected[0]];renderSpots();renderPlateInputs()};function renderPlateInputs(){let box=$('multiPlates'),list=$('platesList');if(!$('multi').checked){box.style.display='none';return}box.style.display='block';list.innerHTML='';selected.forEach((n,i)=>{let x=document.createElement('input');x.id='mplate'+n;x.placeholder=`لوحة موقف ${pad(n)}`;x.value=i===0?$('plate').value:'';list.appendChild(x)})}function fmt(v){if(!v)return '-';let d=new Date(v);return `${pad(d.getHours())}:${pad(d.getMinutes())} · ${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`}function permitCode(){return 'PK-'+($('room').value||'ROOM')+'-'+selected.map(pad).join('')}function plates(){if($('multi').checked){let o={};selected.forEach(n=>o[n]=($('mplate'+n)?.value||''));return o}return{[selected[0]]:$('plate').value}}function dataNow(){return{room:$('room').value,spots:[...selected],plates:plates(),start:$('start').value,end:$('end').value,code:permitCode(),floors:Object.fromEntries(selected.map(n=>[n,spots.find(s=>s.n===n).f]))}}function permitHTML(data){let cards=data.spots.map(n=>`<div class="permit-spot"><div class="spot-top"><div><div class="floorname">${spots.find(s=>s.n===n)?.f||data.floors?.[n]||''} · موقف</div><div class="num">${pad(n)}</div></div><div style="color:#708197">رقم الموقف</div></div><div class="plate">لوحة السيارة: ${data.plates[n]||'-'}</div></div>`).join('');return `<div class="permit"><div class="permit-head"><img class="logo" src="./diyar-logo-exact.jpg?v=7" alt="شعار ديار المدينة"><div class="copy"><h1>تصريح موقف</h1><div>PARKING PERMIT</div></div><div class="pbox">P</div></div>${cards}<div style="margin-top:16px"><div class="prow"><span>رقم الغرفة</span><b>${data.room||'-'}</b></div><div class="prow"><span>رقم التصريح</span><b>${data.code}</b></div><div class="prow"><span>صالح من</span><b>${fmt(data.start)}</b></div><div class="prow"><span>صالح حتى</span><b>${fmt(data.end)}</b></div></div><div class="msg">يرجى إبراز التصريح للحارس عند الدخول</div><div class="print" onclick="window.print()">🖨️ طباعة التصريح / حفظ PDF</div></div>`}function previewPermit(){if(!selected.length)return alert('اختر موقفاً');$('permitHost').innerHTML=permitHTML(dataNow())}function saveBooking(){if(!selected.length)return alert('اختر موقفاً');selected.forEach(n=>spots.find(s=>s.n===n).status=$('status').value);renderSpots();previewPermit()}function clearForm(){$('room').value='';$('plate').value='';$('notes').value='';selected=[];renderSpots();$('permitHost').innerHTML='';renderPlateInputs()}function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_')}function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}function validDates(){let s=new Date($('start').value),e=new Date($('end').value);if(!Number.isFinite(s.getTime())||!Number.isFinite(e.getTime())||e<=s||e<=new Date()){alert('تأكد أن تاريخ النهاية بعد البداية وفي المستقبل.');return false}return true}function createGuestLink(){if(!validDates())return;let d=dataNow(),url=location.origin+location.pathname+'?permit='+enc(d);$('linkMsg').textContent=url;navigator.clipboard?.writeText(url);return url}async function sharePermit(){let url=createGuestLink();if(!url)return;if(navigator.share)try{await navigator.share({title:'تصريح موقف',text:'تصريح موقف الفندق',url})}catch(e){}}function initDates(){let now=new Date(),end=new Date(now.getTime()+3*86400000),local=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$('start').value=local(now);$('end').value=local(end)}function guestMode(){let p=new URLSearchParams(location.search).get('permit');if(!p)return false;try{let d=dec(p),e=new Date(d.end);$('staffView').style.display='none';$('guestView').style.display='block';$('guestView').innerHTML=e<=new Date()?'<div class="title">انتهت صلاحية التصريح</div>':permitHTML(d);return true}catch(e){return false}}initDates();renderSpots();renderPlateInputs();if(!guestMode())previewPermit();
</script></body></html>
